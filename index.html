  <style>
:root{
  --bg:#010308;
  --panel:rgba(5,10,20,.94);
  --panel2:rgba(4,12,27,.96);
  --stroke:rgba(0,242,254,.25);
  --text:#f4f8ff;

  --accent:#00f2fe;
  --accent2:#4facfe;

  --danger:#f43f5e;
  --warning:#fbbf24;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}

*{box-sizing:border-box}

html,body{margin:0;min-height:100%;background:var(--bg)}

body{
  color:var(--text);
  font-family:var(--mono);
  font-size:15px;
  background:
    radial-gradient(circle at 50% 0%,#0b2340 0%,#020610 48%,#010308 100%);
  overflow-x:hidden;
}

button,input{font:inherit}

header{
  min-height:72px;
  padding:14px 24px;
  border-bottom:1px solid var(--stroke);
  background:var(--panel);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  box-shadow:0 5px 24px rgba(0,0,0,.55);
  backdrop-filter:blur(12px);
}

.logo{
  font-size:16px;
  font-weight:900;
  letter-spacing:3px;
  color:var(--accent);
  text-shadow:0 0 14px rgba(0,242,254,.45);
  display:flex;
  align-items:center;
  gap:10px;
}
.logo:before{
  content:"";
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 14px var(--accent);
}

.header-controls{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.api-config-bar{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:40px;
  padding:5px 9px 5px 12px;
  border:1px solid var(--stroke);
  border-radius:7px;
  background:rgba(0,0,0,.45);
  font-size:13px;
}

.api-config-bar input{
  width:170px;
  background:transparent;
  border:0;
  outline:0;
  color:var(--text);
  font-size:13px;
}

.api-config-bar button,
.page-nav-btn,
.viewer-close{
  min-height:34px;
  padding:7px 12px;
  border-radius:5px;
  cursor:pointer;
  font-weight:900;
  font-size:12px;
}

.api-config-bar button,
.page-nav-btn{
  color:var(--accent);
  border:1px solid var(--accent);
  background:rgba(0,242,254,.10);
}
.api-config-bar button:hover,
.page-nav-btn:hover:not(:disabled){
  color:#000;
  background:var(--accent);
}

.status-pill{
  min-height:36px;
  padding:7px 12px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:20px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
}
.pulse{
  width:8px;height:8px;border-radius:50%;
  background:var(--success);
  box-shadow:0 0 10px var(--success);
  animation:blink 2s infinite;
}
@keyframes blink{50%{opacity:.25}}

.workspace{
  width:min(98vw,1400px);
  margin:14px auto;
}

.main-panel{
  min-height:calc(100vh - 100px);
  border:1px solid var(--stroke);
  border-radius:12px;
  background:var(--panel);
  overflow:hidden;
  box-shadow:0 10px 45px rgba(0,0,0,.72);
  display:flex;
  flex-direction:column;
}

.chat-scroll{

  min-height:0;
  padding:18px 20px;

  display:flex;
  flex-direction:column;
  gap:14px;
}

.msg{
  padding:13px 16px;
  border-radius:8px;
  font-size:14px;

}

.msg.system{
  color:var(--accent);
  background:rgba(0,242,254,.04);
  border:1px solid rgba(0,242,254,.16);
}
.msg.user{
  align-self:flex-end;
  color:#fff;
  background:rgba(79,172,254,.10);
  border:1px solid rgba(79,172,254,.28);
}
.msg.ai{

  color:#e2e8f0;

}
.msg.error{

.doc-action-card{

.doc-header-row{

.actions-row{

.matrix{

  <script>
(() => {
"use strict";

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

const GITHUB_CONFIG = {
  owner: "miqueas80",
  repo: "laboratorio-escolar",
  branch: "main"
};

/* Modelo actualizable en un solo lugar. */
const GEMINI_MODEL = "gemini-2.5-flash";

/*
  IMPORTANTE:
  La API Key en una web pública NO es un secreto.
  Para una expo local funciona, pero para producción conviene
  mover la llamada a Gemini a un backend/proxy.
*/

/* =========================================================
   ESTADO
   ========================================================= */

let globalApiKey = localStorage.getItem("nexus_gemini_key") || "";

let repositoryFiles = [];
let repositoryTexts = {};
let activePdfDoc = null;
let activePageNum = 1;
let activeFileName = "";
let activePagesCache = [];
let isRenderingPage = false;

const $ = s => document.querySelector(s);

/* =========================================================
   UTILIDADES
   ========================================================= */

function escapeHtml(str) {
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showToast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.style.display = "block";
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => t.style.display = "none", 2800);
}

function addMsg(boxSelector, text, type) {
  const box = $(boxSelector);
  const div = document.createElement("div");
  div.className = `msg ${type}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function normalizeStr(str) {
  return String(str || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\p{L}\p{N}\s./+\-]/gu," ")
    .replace(/\s+/g," ")
    .trim();
}

function tokenize(str) {
  return new Set(
    normalizeStr(str)
      .split(/\s+/)
      .filter(w => w.length >= 4 && !STOPWORDS.has(w))
  );
}

const STOPWORDS = new Set(`
para desde entre sobre como este esta estos estas una uno unas unos
con sin por del las los que una son fue han hay donde cuando cual
cualquiera puede pueden debe deben deben ser sea sean tener tiene
hacer hace hacia mediante durante parte partes pagina páginas
manual material materiales protocolo protocolos procedimiento
procedimientos unidad tema contenido documento documentos alumno
estudiante ejemplo ejemplo ejemplos forma formas tipo tipos
segun según cada mismo misma mismos mismas luego también tambien
muy más mas menos solo sólo todos todas todo toda
`.trim().split(/\s+/));

/*
  Detecta fórmulas químicas razonables.
  No se usa el nombre de archivo.
*/
function extractFormulas(text) {
  const raw = String(text || "").replace(/\s+/g," ");
  const matches = raw.match(
    /\b(?:[A-Z][a-z]?\d*(?:\([A-Z][a-z]?\d*\)\d*)*(?:[+-]\d*)?|[A-Z][a-z]?\d*[A-Z][a-z]?\d*)\b/g
  ) || [];

  const valid = new Set();

  for (const x of matches) {
    if (x.length < 2 || x.length > 18) continue;
    if (!/[A-Z]/.test(x)) continue;
    if (!/\d/.test(x) && x.length <= 2) continue;
    valid.add(x);
  }
  return valid;
}

/*
  Crea una representación compacta por documento.
  Se ignoran rutas, carpetas y nombres de archivo.
*/
function buildDocumentProfile(pages) {
  const full = pages.join(" ");
  const words = tokenize(full);
  const formulas = extractFormulas(full);
  return {
    words,
    formulas,
    normalized: normalizeStr(full),
    pageNormalized: pages.map(normalizeStr)
  };
}

/*
  Similitud estricta:
  - fórmula compartida: señal fuerte
  - términos distintivos: señal secundaria
  - NO se usa la carpeta
  - NO se usa el nombre del archivo
  - pocas palabras compartidas => no hay conexión
*/
function compareDocuments(a, b) {
  const wa = a.words, wb = b.words;
  const fa = a.formulas, fb = b.formulas;

  const sharedWords = [...wa].filter(x => wb.has(x));
  const sharedFormulas = [...fa].filter(x => fb.has(x));

  const minWords = Math.max(1, Math.min(wa.size, wb.size));
  const wordJaccard =
    sharedWords.length / Math.max(1, wa.size + wb.size - sharedWords.length);

  const wordCoverage = sharedWords.length / minWords;

  let score = 0;
  const reasons = [];

  if (sharedFormulas.length) {
    score += Math.min(70, sharedFormulas.length * 25);
    reasons.push(`${sharedFormulas.length} fórmula(s) compartida(s)`);
  }

  if (sharedWords.length >= 3) {
    score += Math.min(30, wordCoverage * 28 + wordJaccard * 18);
    reasons.push(`${sharedWords.length} conceptos específicos compartidos`);
  }

  /*
    Conexión válida:
    A) fórmula compartida + al menos una evidencia conceptual
    B) sin fórmula, al menos 5 conceptos distintivos y similitud real
  */
  const strongFormula =
    sharedFormulas.length >= 1 && sharedWords.length >= 1;

  const strongConcept =
    sharedWords.length >= 5 &&
    wordJaccard >= 0.025 &&
    wordCoverage >= 0.08;

  const connected = strongFormula || strongConcept;

  if (!connected) score = 0;

  return {
    score: Math.min(100, Math.round(score)),
    connected,
    sharedWords: sharedWords.slice(0,10),
    sharedFormulas: sharedFormulas.slice(0,8),
    reasons
  };
}

/* =========================================================
   GITHUB — RECORRIDO RECURSIVO
   ========================================================= */

async function githubContents(path = "") {
  const encodedPath = path
    .split("/")
    .filter(Boolean)
    .map(encodeURIComponent)
    .join("/");

  const url =
    `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/` +
    encodedPath +
    `?ref=${encodeURIComponent(GITHUB_CONFIG.branch)}`;

  const res = await fetch(url, {
    headers: { "Accept": "application/vnd.github+json" }
  });

  if (!res.ok) {
    const body = await res.text().catch(() => "");
    throw new Error(`GitHub ${res.status}: ${body.slice(0,180)}`);
  }

  return res.json();
}

async function fetchPdfTree(path = "") {
  const data = await githubContents(path);

  if (!Array.isArray(data)) return [];

  const found = [];

  for (const item of data) {
    if (item.type === "file" && /\.pdf$/i.test(item.name)) {
      found.push({
        name: item.name,
        path: item.path,
        url: `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${item.path.split("/").map(encodeURIComponent).join("/")}`
      });
    }
    else if (item.type === "dir") {
      const children = await fetchPdfTree(item.path);
      found.push(...children);
    }
  }

  return found;
}

/* =========================================================
   INDEXACIÓN
   ========================================================= */

async function indexAllPdfs() {
  $("#sysState").textContent = `Indexando 0/${repositoryFiles.length}...`;

  let ok = 0;

  for (let i = 0; i < repositoryFiles.length; i++) {
    const file = repositoryFiles[i];

    try {
      const pdf = await pdfjsLib.getDocument({
        url: file.url,
        disableAutoFetch: false
      }).promise;

      const pages = [];

      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        pages.push(content.items.map(x => x.str || "").join(" "));
      }

      repositoryTexts[file.path] = {
        original: pages,
        profile: buildDocumentProfile(pages),
        name: file.name,
        path: file.path,
        url: file.url
      };

      ok++;
    } catch (err) {
      console.warn("No se pudo indexar:", file.path, err);
      repositoryTexts[file.path] = {
        original: [],
        profile: buildDocumentProfile([]),
        name: file.name,
        path: file.path,
        url: file.url,
        error: true
      };
    }

    $("#sysState").textContent =
      `Indexando ${i + 1}/${repositoryFiles.length}...`;
  }

  $("#sysState").textContent = `Sistema listo · ${ok}/${repositoryFiles.length} PDFs`;

  $("#mainQueryInput").disabled = false;
  $("#mainSendBtn").disabled = false;

  addMsg(
    "#mainChatBox",
    `>> ${ok} manuales indexados. Se analizaron también las subcarpetas. El mapa NO conecta documentos por estar en la misma carpeta.`,
    "system"
  );
}

/* =========================================================
   MAPA
   ========================================================= */

function renderKnowledgeMap(centerPath, matches) {
  const existing = document.querySelector(".matrix");
  if (existing) existing.remove();

  const matrix = document.createElement("div");
  matrix.className = "matrix";

  const connected = matches.filter(x => x.relation.connected);

  matrix.innerHTML = `
    <div class="section-head">
      <span>🔗 MATRIZ DE CONOCIMIENTO</span>
      <small>${connected.length} conexión(es) reales</small>
    </div>
  `;

  if (!connected.length) {
    matrix.insertAdjacentHTML("beforeend", `
      <div class="relation-list">
        <div class="relation">
          <div>
            <div class="relation-name">Sin conexiones suficientemente fuertes</div>
            <div class="relation-reason">NEXUS-X descartó relaciones débiles en lugar de inventarlas.</div>
          </div>
        </div>
      </div>
    `);
    return matrix;
  }

  const list = document.createElement("div");
  list.className = "relation-list";

  connected
    .sort((a,b) => b.relation.score - a.relation.score)
    .forEach(item => {
      const r = document.createElement("div");
      r.className = "relation";
      r.innerHTML = `
        <div>
          <div class="relation-name">📄 ${escapeHtml(item.doc.name)}</div>
          <div class="relation-reason">
            ${escapeHtml(item.relation.reasons.join(" · "))}
            ${item.relation.sharedFormulas.length
              ? ` · Fórmulas: ${escapeHtml(item.relation.sharedFormulas.join(", "))}`
              : ""}
          </div>
        </div>
        <div class="score">${item.relation.score}%</div>
      `;
      list.appendChild(r);
    });

  matrix.appendChild(list);

  const map = buildMap(centerPath, connected);
  matrix.appendChild(map);

  return matrix;
}

function buildMap(centerPath, connected) {
  const wrap = document.createElement("div");
  wrap.className = "map-wrap";

  const canvas = document.createElement("div");
  canvas.className = "map-canvas";

  const all = [{
    path:centerPath,
    name:repositoryTexts[centerPath]?.name || centerPath,
    center:true
  }, ...connected.map(x => ({
    path:x.doc.path,
    name:x.doc.name,
    score:x.relation.score
  }))];

  const unique = [];
  const seen = new Set();
  for (const x of all) {
    if (!seen.has(x.path)) {
      seen.add(x.path);
      unique.push(x);
    }
  }

  const positions = [];
  const center = {x:50,y:48};
  positions.push(center);

  const radiusX = Math.min(37, 12 + unique.length * 4.5);
  const radiusY = Math.min(34, 12 + unique.length * 3.5);

  for (let i=1;i<unique.length;i++) {
    const angle = ((i-1) / Math.max(1,unique.length-1)) * Math.PI * 2 - Math.PI/2;
    positions.push({
      x:50 + Math.cos(angle) * radiusX,
      y:48 + Math.sin(angle) * radiusY
    });
  }

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS,"svg");
  svg.classList.add("map-svg");
  svg.setAttribute("viewBox","0 0 1000 520");
  svg.preserveAspectRatio = "none";

  unique.forEach((node,i) => {
    if (i===0) return;

    const line = document.createElementNS(svgNS,"line");
    line.classList.add("map-edge");
    line.setAttribute("x1", positions[0].x*10);
    line.setAttribute("y1", positions[0].y*5.2);
    line.setAttribute("x2", positions[i].x*10);
    line.setAttribute("y2", positions[i].y*5.2);
    svg.appendChild(line);

    const score = document.createElementNS(svgNS,"text");
    score.classList.add("map-edge-label");
    score.setAttribute("x",((positions[0].x+positions[i].x)/2)*10);
    score.setAttribute("y",((positions[0].y+positions[i].y)/2)*5.2-6);
    score.textContent = `${node.score}%`;
    svg.appendChild(score);
  });

  canvas.appendChild(svg);

  unique.forEach((node,i) => {
    const el = document.createElement("div");
    el.className = "map-node";
    el.style.left = `${positions[i].x}%`;
    el.style.top = `${positions[i].y}%`;

    el.innerHTML = `
      <strong>${node.center ? "🎯 " : "📄 "}${escapeHtml(node.name)}</strong>
      <span>${node.center ? "DOCUMENTO CONSULTADO" : `RELACIÓN ${node.score}%`}</span>
    `;

    el.addEventListener("click", () => loadPdfInModal(node.path,1));
    canvas.appendChild(el);
  });

  wrap.appendChild(canvas);
  return wrap;
}

/* =========================================================
   BÚSQUEDA
   ========================================================= */

function findBestPages(profile, query) {
  const words = [...tokenize(query)];
  if (!words.length) return [];

  const results = [];

  profile.pageNormalized.forEach((pageText, index) => {
    let hits = 0;
    for (const word of words) {
      if (pageText.includes(word)) hits++;
    }
    if (hits) results.push({page:index+1,hits});
  });

  return results.sort((a,b)=>b.hits-a.hits).slice(0,8);
}

function handleMainGlobalQuery() {
  const val = $("#mainQueryInput").value.trim();
  if (!val) return;

  addMsg("#mainChatBox", val, "user");
  $("#mainQueryInput").value = "";

  addMsg("#mainChatBox", `>> Analizando contenido real para: "${val}"...`, "system");

  const queryNorm = normalizeStr(val);
  const queryWords = [...tokenize(val)];

  const matches = [];

  for (const file of repositoryFiles) {
    const doc = repositoryTexts[file.path];
    if (!doc || doc.error) continue;

    const pages = findBestPages(doc.profile, val);
    const directHits = pages.reduce((n,p)=>n+p.hits,0);

    if (
      doc.profile.normalized.includes(queryNorm) ||
      (queryWords.length && directHits >= Math.min(2,queryWords.length))
    ) {
      matches.push({doc,pages});
    }
  }

  if (!matches.length) {
    addMsg(
      "#mainChatBox",
      `>> No se encontraron manuales con evidencia suficiente para "${val}".`,
      "error"
    );
    return;
  }

  const aiMsg = addMsg(
    "#mainChatBox",
    `Se encontraron ${matches.length} manuales relacionados con "${val}":`,
    "ai"
  );

  for (const item of matches) {
    const doc = item.doc;

    const card = document.createElement("div");
    card.className = "doc-action-card";

    const folder = doc.path.includes("/")
      ? doc.path.split("/").slice(0,-1).join("/") + "/"
      : "raíz/";

    card.innerHTML = `
      <div class="doc-header-row">
        <div>
          <div class="doc-action-title">📄 ${escapeHtml(doc.name)}</div>
          <div class="doc-meta">📁 ${escapeHtml(folder)}</div>
        </div>
      </div>
      <div class="doc-meta">
        Páginas relevantes:
        ${item.pages.length ? item.pages.map(x=>x.page).join(", ") : "—"}
      </div>
      <div class="actions-row">
        <button class="action-btn open-file-btn">🔍 ABRIR EN VISOR</button>
        <a class="action-btn download" href="${doc.url}" target="_blank" rel="noopener">
          💾 ABRIR PDF
        </a>
      </div>
    `;

    card.querySelector(".open-file-btn").addEventListener("click",()=>{
      const firstPage = item.pages[0]?.page || 1;
      loadPdfInModal(doc.path,firstPage);
    });

    aiMsg.appendChild(card);
  }

  /*
    Mapa basado SOLO en los documentos encontrados y su contenido.
    No se usa la carpeta ni el nombre para calcular relaciones.
  */
  const center = matches[0].doc.path;

  const relationCandidates = [];
  const centerProfile = repositoryTexts[center]?.profile;

  if (centerProfile) {
    for (const file of repositoryFiles) {
      if (file.path === center) continue;
      const other = repositoryTexts[file.path];
      if (!other || other.error) continue;

      const relation = compareDocuments(centerProfile, other.profile);

      if (relation.connected) {
        relationCandidates.push({doc:other,relation});
      }
    }
  }

  aiMsg.appendChild(renderKnowledgeMap(center,relationCandidates));

  $("#mainChatBox").scrollTop = $("#mainChatBox").scrollHeight;
}

/* =========================================================
   VISOR PDF
   ========================================================= */

async function loadPdfInModal(filePath,targetPage=1) {
  const doc = repositoryTexts[filePath];
  if (!doc) return;

  activeFileName = filePath;
  activePagesCache = doc.original || [];

  $("#modalDocTitle").textContent = `📄 ${doc.name}`;
  $("#pdfViewerModal").style.display = "flex";

  $("#modalChatHistory").innerHTML = `
    <div class="v-msg bot">
      Manual "${escapeHtml(doc.name)}" cargado.
      Podés preguntarme por una página, un concepto o pedir un resumen.
    </div>
  `;

  try {
    activePdfDoc = await pdfjsLib.getDocument(doc.url).promise;
    activePageNum = Math.max(1,Math.min(targetPage,activePdfDoc.numPages));
    await renderCurrentPage();
  } catch(e) {
    console.error(e);
    showToast("No se pudo cargar el PDF.");
  }
}

async function renderCurrentPage() {
  if (!activePdfDoc || isRenderingPage) return;

  isRenderingPage = true;

  try {
    $("#pageIndicator").textContent =
      `Pág. ${activePageNum} / ${activePdfDoc.numPages}`;

    $("#prevPageBtn").disabled = activePageNum <= 1;
    $("#nextPageBtn").disabled = activePageNum >= activePdfDoc.numPages;

    const page = await activePdfDoc.getPage(activePageNum);
    const canvas = $("#pdfCanvas");
    const ctx = canvas.getContext("2d");

    const container = document.querySelector(".canvas-container");
    const base = page.getViewport({scale:1});
    const available = Math.max(320,(container.clientWidth || 800)-30);

    /*
      El PDF ocupa el espacio disponible sin hacerse diminuto.
    */
    const scale = Math.max(.9,available/base.width);
    const viewport = page.getViewport({scale});

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
      canvasContext:ctx,
      viewport
    }).promise;

  } catch(e) {
    console.error(e);
  } finally {
    isRenderingPage = false;
  }
}

/* =========================================================
   GEMINI
   ========================================================= */

async function callGeminiAPI(prompt,key) {
  if (!key) throw new Error("Falta la API Key.");

  const url =
    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`;

  const res = await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      contents:[{
        role:"user",
        parts:[{text:prompt}]
      }],
      generationConfig:{
        temperature:.25,
        maxOutputTokens:1800
      }
    })
  });

  const data = await res.json().catch(()=>({}));

  if (!res.ok) {
    throw new Error(data?.error?.message || `HTTP ${res.status}`);
  }

  const text = data?.candidates?.[0]?.content?.parts
    ?.map(p=>p.text || "")
    .join("")
    .trim();

  if (!text) throw new Error("Gemini no devolvió texto.");
  return text;
}

function formatAiText(text) {
  /*
    Seguridad: no se inserta HTML generado por Gemini.
    Se mantiene simple y legible.
  */
  return escapeHtml(text)
    .replace(/\*\*(.*?)\*\*/g,"$1")
    .replace(/\n/g,"<br>");
}

async function handleModalAIQuery() {
  const val = $("#modalQueryInput").value.trim();
  if (!val) return;

  const hist = $("#modalChatHistory");

  const u = document.createElement("div");
  u.className = "v-msg user";
  u.textContent = val;
  hist.appendChild(u);

  $("#modalQueryInput").value = "";

  const b = document.createElement("div");
  b.className = "v-msg bot";
  b.textContent = "Analizando el contenido del manual...";
  hist.appendChild(b);
  hist.scrollTop = hist.scrollHeight;

  $("#modalSendBtn").disabled = true;

  const key = localStorage.getItem("nexus_gemini_key") || globalApiKey;

  if (!key) {
    b.textContent = "⚠️ Guardá primero tu API Key arriba.";
    $("#modalSendBtn").disabled = false;
    return;
  }

  try {
    const pages = activePagesCache || [];

    /*
      Para evitar prompts gigantes:
      - si el documento es pequeño, se manda entero
      - si es grande, se manda primero el texto de las páginas
        que coinciden con la consulta y un contexto limitado.
    */
    const queryWords = [...tokenize(val)];
    const ranked = pages.map((text,index)=>{
      let hits = 0;
      const n = normalizeStr(text);
      for (const w of queryWords) if (n.includes(w)) hits++;
      return {text,index,hits};
    }).sort((a,b)=>b.hits-a.hits);

    const selected =
      pages.length <= 18
        ? pages.map((text,index)=>({text,index}))
        : ranked.slice(0,12);

    const context = selected
      .map(x=>`--- PÁGINA ${x.index+1} ---\n${x.text}`)
      .join("\n\n")
      .slice(0,50000);

    const prompt = `
Sos el asistente técnico de NEXUS-X.
Respondé en español, claro y natural.

DOCUMENTO: ${activeFileName}

CONTENIDO DISPONIBLE:
${context}

CONSULTA DEL ESTUDIANTE:
${val}

REGLAS:
1. Basate únicamente en el contenido proporcionado.
2. Si usás información de una página, indicá "Página X".
3. Si el contenido no alcanza para responder, decilo claramente.
4. No inventes datos.
5. No uses LaTeX.
6. Para fórmulas químicas escribí texto simple, por ejemplo H2O, CO2, NaCl.
7. Explicá como un tutor, no como un robot.
`;

    const answer = await callGeminiAPI(prompt,key);
    b.innerHTML = formatAiText(answer);

  } catch(err) {
    console.error(err);
    b.textContent = `⚠️ Error al consultar Gemini: ${err.message}`;
  } finally {
    $("#modalSendBtn").disabled = false;
    hist.scrollTop = hist.scrollHeight;
  }
}

});
